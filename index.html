<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aumento</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1> Aumento</h1>

    <label for="salario">Digite o salário da pessoa (R$):</label>
    <input id="salario" type="number" step="0.01" placeholder="Ex: 2500" />

    <div class="buttons">
      <button id="calcular">Calcular</button>
      <button id="limpar" class="secondary">Limpar</button>
    </div>

    <section class="result">
      <h2> Resultado</h2>
      <p id="novoSalario"></p>
      <p id="aumento"></p>
      <p id="percentual"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
